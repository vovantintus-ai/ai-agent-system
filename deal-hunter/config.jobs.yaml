# Job vacancies: real employment openings from employers (Marktplaats
# "Vacatures" section) in the trades you care about. Region around Rotterdam
# (50km). Grouped by trade.
#   python3 run.py --config config.jobs.yaml --telegram --photos --print

_common: &common
  postcode: "3011"
  distance_km: 50
  limit: 40
  require_path: "vacatures"    # job-vacancy section only (real openings)

sources:
  - { type: marktplaats, query: "elektricien",  category: "Электрика",        <<: *common }
  - { type: marktplaats, query: "loodgieter",   category: "Сантехника",       <<: *common }
  - { type: marktplaats, query: "installateur", category: "Монтаж/установка",  <<: *common }
  - { type: marktplaats, query: "monteur",      category: "Монтажник",        <<: *common }
  - { type: marktplaats, query: "timmerman",    category: "Плотник",          <<: *common }
  - { type: marktplaats, query: "cv monteur",   category: "Отопление",        <<: *common }
  - { type: marktplaats, query: "badkamer",     category: "Ванные/ремонт",    <<: *common }
  - { type: marktplaats, query: "onderhoudsmonteur", category: "Обслуживание", <<: *common }

list_all: true

translate: true
translate_from: nl
translate_to: ru

max_per_category: 8
max_deals: 60

state_path: ~/re-jobs-state.json
output_path: ~/re-jobs-latest.md
