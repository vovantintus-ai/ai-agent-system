# Config used by the scheduled GitHub Actions run (.github/workflows/deal-hunter.yml).
# This one IS committed (unlike config.yaml, which is gitignored for local use).
#
# It ships with a working public source so the agent produces REAL signals out
# of the box. Edit `sources` / `baselines` / `watch_terms` to point it at the
# market you actually care about (a classifieds RSS feed, a local buy/sell sub).

sources:
  # Demo source — no network, always returns a fixed set of listings so the
  # full loop (find -> commit -> issue -> email) is demonstrable on every fresh
  # run. Its deals are deduped after the first delivery. REMOVE this once a real
  # market feed below is working.
  - type: sample

  # NOTE: reddit's JSON API blocks datacenter IPs (GitHub runners) without OAuth,
  # so it usually returns nothing here. Prefer an RSS feed (below) for a real
  # market — RSS feeds are not IP-blocked the way reddit is.
  - type: reddit
    subreddit: buildapcsales
    category: deals
    user_agent: "deal-hunter/0.1 (github actions; contact via repo)"
    limit: 75

  # Point this at a real classifieds/jobs search feed to hunt your own market
  # (e.g. Indeed.nl, a marketplace search RSS, TenderNed). Then remove `sample`.
  # - type: rss
  #   name: my-market
  #   url: "https://<site>/search.rss?q=elektricien"
  #   category: jobs

# Bonus points when a title contains any of these.
watch_terms:
  - urgent
  - "quick sale"
  - clearance
  - open box

# Fallback reference prices per category, used when there are not enough
# comparable live listings to compute a reliable median on their own.
baselines:
  deals: 300
  tools: 200

# Everything below the category reference by at least this much counts.
min_discount: 0.15
min_score: 20.0
min_samples: 5
max_deals: 20

# Committed back by the workflow so memory + latest digest survive between runs.
# Paths are relative to the workflow's working-directory (deal-hunter/), so they
# must NOT be prefixed with deal-hunter/ — the commit step adds the deal-hunter/
# prefix itself.
state_path: state/seen.json
output_path: digests/latest.md
