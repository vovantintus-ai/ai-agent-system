# Real estate — FOR SALE (koop): homes at/under EUR 150,000.
# ONLY the housing section (require_path: huizen-en-kamers) so kitchens,
# appliances, thermostats and vacation ads are dropped.
# Areas: Rotterdam (40km), Den Haag (30km), Breda (30km), Utrecht (30km).
#   python3 run.py --config config.realestate-koop.yaml --telegram --print

# Sub-sections to drop even inside the housing section (garages, land,
# vacation/recreation, moorings, storage, and any stray non-home ads).
_exclude: &exclude
  - garages
  - parkeer
  - grond
  - kavel
  - recreatie
  - stacaravan
  - chalet
  - vakantie
  - ligplaats
  - opslag
  - bedrijfs
  - keuken
  - thermostaten
  - huis-en-inrichting
  - doe-het-zelf

sources:
  - type: marktplaats
    query: "woning"
    require_path: "huizen-en-kamers"
    exclude_paths: *exclude
    category: Rotterdam
    postcode: "3011"
    distance_km: 40
    limit: 80
  - type: marktplaats
    query: "woning"
    require_path: "huizen-en-kamers"
    exclude_paths: *exclude
    category: "Den Haag"
    postcode: "2511"
    distance_km: 30
    limit: 80
  - type: marktplaats
    query: "woning"
    require_path: "huizen-en-kamers"
    exclude_paths: *exclude
    category: Breda
    postcode: "4811"
    distance_km: 30
    limit: 80
  - type: marktplaats
    query: "woning"
    require_path: "huizen-en-kamers"
    exclude_paths: *exclude
    category: Utrecht
    postcode: "3511"
    distance_km: 30
    limit: 80

# Sale band: 20k..150k. min_price keeps cheap rentals out of the for-sale feed.
min_price: 20000
max_price: 150000

translate: true
translate_from: nl
translate_to: ru

max_per_category: 6
max_deals: 24

state_path: ~/re-koop-state.json
output_path: ~/re-koop-latest.md
